<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圖書掃描建檔系統</title>
    <!-- 引入 html5-qrcode 函式庫 -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#007bff'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center p-6 font-sans">
    
    <!-- 導覽列 / 登入區塊 -->
    <div class="w-full max-w-lg mb-6 flex justify-end items-center" id="auth-container">
        <!-- 未登入狀態 -->
        <a href="/api/auth/line" id="login-btn" class="bg-[#06C755] hover:bg-[#05b04b] text-white font-bold py-2 px-4 rounded-full shadow flex items-center gap-2 transition duration-200">
            <svg viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5"><path d="M24 10.304c0-5.369-5.383-9.738-12-9.738-6.616 0-12 4.369-12 9.738 0 4.814 4.269 8.846 10.036 9.608.391.084.922.258 1.057.592.121.298.077.757.037 1.059l-.173 1.05c-.053.328-.242 1.289 1.134.708 1.375-.582 7.42-4.372 9.684-7.147C23.366 14.12 24 12.317 24 10.304z"/></svg>
            LINE 登入
        </a>
        <!-- 已登入狀態 (預設隱藏) -->
        <div id="user-profile" class="hidden flex items-center gap-3 bg-white px-4 py-2 rounded-full shadow-sm border border-gray-200">
            <img id="user-avatar" src="" alt="Avatar" class="w-8 h-8 rounded-full border border-gray-200">
            <span id="user-name" class="font-semibold text-gray-700 text-sm"></span>
            <button onclick="logout()" class="text-xs text-red-500 hover:text-red-700 ml-2 border-l pl-2 border-gray-300">登出</button>
        </div>
    </div>

    <div class="w-full max-w-lg mb-6 text-center -mt-4">
        <h2 class="text-3xl font-bold text-gray-800 flex items-center justify-center gap-2">
            <span class="text-4xl">📚</span> 圖書掃描建檔
        </h2>
        <p class="text-gray-500 mt-2 text-sm">請將鏡頭對準書本背面的 ISBN 條碼</p>
        <button onclick="toggleBookList()" class="mt-4 text-blue-600 font-semibold hover:underline border border-blue-600 rounded-lg px-4 py-2 hover:bg-blue-50 transition">
            📂 查看已建檔書籍清單
        </button>
    </div>
    
    <!-- 手動搜尋 ISBN -->
    <div class="w-full max-w-lg mb-4 bg-white rounded-xl shadow-sm p-4 border border-gray-200">
        <form id="search-form" class="flex gap-2" onsubmit="handleSearchSubmit(event)">
            <input type="text" id="search-isbn" placeholder="手動輸入 ISBN 條碼..." required class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg shadow transition duration-200">
                查詢
            </button>
        </form>
    </div>

    <!-- 掃描器畫面 -->
    <div id="reader" class="w-full max-w-lg bg-white rounded-xl shadow-lg overflow-hidden border border-gray-200"></div>
    
    <!-- 掃描與查詢結果 -->
    <div id="result-card" class="hidden mt-6 w-full max-w-lg bg-white rounded-xl shadow-lg p-6 border border-gray-200">
        <div class="flex flex-col items-center text-center">
            <div id="status-text" class="text-lg font-semibold text-blue-600 mb-4 bg-blue-50 px-4 py-2 rounded-full w-full">讀取中...</div>
            <img id="book-cover" src="" alt="書本封面" class="hidden w-32 h-auto object-cover rounded-md shadow-md mb-4 border border-gray-100">
            <h3 id="book-title" class="text-xl font-bold text-gray-800 mb-2 leading-tight"></h3>
            <p id="book-authors" class="text-md text-gray-600 font-medium"></p>
        </div>
    </div>

    <!-- 手動建檔表單 -->
    <div id="manual-entry-card" class="hidden mt-6 w-full max-w-lg bg-white rounded-xl shadow-lg p-6 border border-gray-200">
        <div class="text-center mb-6">
            <h3 class="text-xl font-bold text-gray-800">無法自動獲取資料</h3>
            <p class="text-sm text-gray-500 mt-1">請協助手動輸入書本資訊建檔</p>
        </div>
        <form id="manual-form" class="space-y-4" onsubmit="handleManualSubmit(event)">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ISBN 條碼</label>
                <input type="text" id="manual-isbn" readonly class="w-full bg-gray-100 text-gray-500 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">書名 <span class="text-red-500">*</span></label>
                <input type="text" id="manual-title" required class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">作者 <span class="text-red-500">*</span></label>
                <input type="text" id="manual-author" required class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">出版年份</label>
                <input type="number" id="manual-year" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow transition duration-200 mt-4">
                儲存建檔
            </button>
        </form>
    </div>

    <!-- 已建檔書籍清單 -->
    <div id="book-list-container" class="hidden w-full max-w-lg mt-6">
        <h3 class="text-2xl font-bold text-gray-800 mb-4 border-b pb-2">📦 館藏清單</h3>
        <div id="book-list" class="space-y-3">
            <!-- 書籍列表會動態生成在這裡 -->
        </div>
    </div>

    <script>
        // 用來記錄上一次掃描的 ISBN，避免相機在半秒內重複觸發數十次 API 請求
        let lastScannedIsbn = "";
        
        // 驗證並加載登入狀態
        async function checkAuthStatus() {
            // 從 URL 抓取 token (如果是剛登入回來)
            const urlParams = new URLSearchParams(window.location.search);
            const tokenFromUrl = urlParams.get('token');
            if (tokenFromUrl) {
                localStorage.setItem('auth_token', tokenFromUrl);
                // 清理 URL 讓畫面比較乾淨
                window.history.replaceState({}, document.title, window.location.pathname);
            }

            const token = localStorage.getItem('auth_token');
            if (!token) return;

            try {
                const response = await fetch('/api/auth/me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('login-btn').classList.add('hidden');
                    document.getElementById('user-profile').classList.remove('hidden');
                    document.getElementById('user-name').innerText = data.user.name;
                    if (data.user.pictureUrl) {
                        document.getElementById('user-avatar').src = data.user.pictureUrl;
                    }
                } else {
                    // Token 失效
                    logout();
                }
            } catch (err) {
                console.error('Auth error:', err);
            }
        }

        function logout() {
            localStorage.removeItem('auth_token');
            document.getElementById('login-btn').classList.remove('hidden');
            document.getElementById('user-profile').classList.add('hidden');
        }

        // 頁面載入時檢查登入狀態
        window.addEventListener('DOMContentLoaded', checkAuthStatus);
        
        // 為了相容性，必須在使用者互動後 (例如第一次點擊) 才能確實播放音效
        // 由於掃描是自動的，有些瀏覽器可能會阻擋未經互動的 AudioContext 播放
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // 產生輕量的「嗶」聲
        function playBeepSound() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(880, audioCtx.currentTime); // 880Hz, A5 note
            
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.1);
        }

        // 更新 UI 狀態輔助函式
        function updateStatus(message, isError = false, isSuccess = false) {
            const statusText = document.getElementById('status-text');
            statusText.innerText = message;
            
            // 重置樣式
            statusText.className = "text-lg font-semibold mb-4 px-4 py-2 rounded-full w-full text-center ";
            
            if (isError) {
                statusText.classList.add("text-red-600", "bg-red-50");
            } else if (isSuccess) {
                statusText.classList.add("text-green-700", "bg-green-50");
            } else {
                statusText.classList.add("text-blue-600", "bg-blue-50");
            }
        }

        function showResultCard(title, authors, thumbnailUrl) {
            document.getElementById('result-card').classList.remove('hidden');
            document.getElementById('manual-entry-card').classList.add('hidden');
            
            const titleEl = document.getElementById('book-title');
            const authorsEl = document.getElementById('book-authors');
            const coverEl = document.getElementById('book-cover');
            
            updateStatus("✅ 查詢成功！", false, true);
            titleEl.innerText = title;
            authorsEl.innerText = `作者：${authors}`;
            
            if (thumbnailUrl) {
                coverEl.src = thumbnailUrl;
                coverEl.classList.remove('hidden');
            } else {
                coverEl.classList.add('hidden');
            }
        }

        function showManualForm(isbn) {
            document.getElementById('result-card').classList.add('hidden');
            const manualCard = document.getElementById('manual-entry-card');
            manualCard.classList.remove('hidden');
            
            document.getElementById('manual-isbn').value = isbn || '';
            document.getElementById('manual-title').value = '';
            document.getElementById('manual-author').value = '';
            document.getElementById('manual-year').value = '';
            
            updateStatus("需要手動輸入資料", true);
        }

        function handleSearchSubmit(e) {
            e.preventDefault();
            const isbn = document.getElementById('search-isbn').value.trim();
            if (isbn) {
                lastScannedIsbn = isbn;
                fetchBookInfo(isbn);
            }
        }

        async function handleManualSubmit(e) {
            e.preventDefault();
            const isbn = document.getElementById('manual-isbn').value;
            const title = document.getElementById('manual-title').value;
            const author = document.getElementById('manual-author').value;
            const year = document.getElementById('manual-year').value;
            
            try {
                const response = await fetch('/api/books', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        isbn: isbn,
                        title: title,
                        author: author,
                        publishYear: year
                    })
                });
                
                if (response.ok) {
                    alert(`手動建檔成功並寫入資料庫！\nISBN: ${isbn}\n書名: ${title}`);
                } else {
                    const err = await response.json();
                    alert(`寫入資料庫失敗: ${err.error}`);
                }
            } catch (error) {
                console.error("Save error:", error);
                alert("無法連線至本地伺服器，請確認伺服器已啟動");
            }
            
            // 隱藏表單，重置掃描器狀態準備下一次掃描
            document.getElementById('manual-entry-card').classList.add('hidden');
            lastScannedIsbn = ""; 
        }

        // 本地後端 API (Node.js) 的 Fallback 與爬蟲
        async function fetchLocalAPI(isbn) {
            const apiUrl = `/api/lookup/${isbn}`;
            try {
                updateStatus(`本地爬蟲查詢中...`);
                const response = await fetch(apiUrl);
                
                if (!response.ok) {
                    throw new Error('Local API not found');
                }
                
                const data = await response.json();
                
                if (data && data.title) {
                    showResultCard(data.title, data.author, data.coverUrl);
                    // 順便儲存到資料庫
                    saveBookToDatabase({
                        isbn: isbn,
                        title: data.title,
                        author: data.author,
                        coverUrl: data.coverUrl
                    });
                } else {
                    showManualForm(isbn);
                }
            } catch (error) {
                console.error("Local API 錯誤:", error);
                showManualForm(isbn);
            }
        }

        async function saveBookToDatabase(bookData) {
            try {
                const response = await fetch('/api/books', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bookData)
                });
                if (response.ok) {
                    console.log('Book saved to database successfully');
                    // 如果目前正在看書單，就重新載入
                    if (!document.getElementById('book-list-container').classList.contains('hidden')) {
                        loadBooks();
                    }
                }
            } catch (error) {
                console.error('Failed to save to database:', error);
            }
        }

        // 載入並顯示已建檔書籍
        async function loadBooks() {
            const listContainer = document.getElementById('book-list');
            listContainer.innerHTML = '<div class="text-center text-gray-500 py-4">載入中...</div>';
            
            try {
                const response = await fetch('/api/books');
                const books = await response.json();
                
                if (books.length === 0) {
                    listContainer.innerHTML = '<div class="text-center text-gray-500 py-4">目前還沒有建檔任何書籍喔！</div>';
                    return;
                }

                listContainer.innerHTML = books.map(book => `
                    <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200" id="book-container-${book.id}">
                        <!-- 顯示模式 -->
                        <div id="book-view-${book.id}" class="flex justify-between items-start">
                            <div class="flex-1">
                                <span class="text-xs text-gray-400 mb-1">ISBN: ${book.isbn}</span>
                                <h4 class="text-lg font-bold text-gray-800 leading-snug">${book.title}</h4>
                                <p class="text-sm text-gray-600 mt-1">${book.author}</p>
                            </div>
                            <div class="flex gap-2 ml-2">
                                <button onclick="enableEdit(${book.id})" class="text-sm text-blue-600 hover:text-blue-800 hover:bg-blue-50 px-2 py-1 rounded transition">編輯</button>
                                <button onclick="deleteBook(${book.id})" class="text-sm text-red-600 hover:text-red-800 hover:bg-red-50 px-2 py-1 rounded transition">刪除</button>
                            </div>
                        </div>
                        
                        <!-- 編輯模式 -->
                        <div id="book-edit-${book.id}" class="hidden flex-col gap-2 mt-2 border-t pt-2 border-gray-100">
                            <input type="text" id="edit-title-${book.id}" value="${book.title.replace(/"/g, '&quot;')}" class="w-full border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none focus:border-blue-500" placeholder="書名">
                            <input type="text" id="edit-author-${book.id}" value="${book.author.replace(/"/g, '&quot;')}" class="w-full border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none focus:border-blue-500" placeholder="作者">
                            <div class="flex justify-end gap-2 mt-1">
                                <button onclick="cancelEdit(${book.id})" class="text-sm text-gray-500 hover:text-gray-700 bg-gray-100 hover:bg-gray-200 px-3 py-1 rounded transition">取消</button>
                                <button onclick="saveBook(${book.id})" class="text-sm text-white bg-blue-600 hover:bg-blue-700 px-3 py-1 rounded shadow transition">儲存</button>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error("載入書單失敗:", error);
                listContainer.innerHTML = '<div class="text-center text-red-500 py-4">無法連線至伺服器讀取書單</div>';
            }
        }

        function enableEdit(id) {
            document.getElementById(`book-view-${id}`).classList.add('hidden');
            document.getElementById(`book-edit-${id}`).classList.remove('hidden');
            document.getElementById(`book-edit-${id}`).classList.add('flex');
        }

        function cancelEdit(id) {
            document.getElementById(`book-edit-${id}`).classList.add('hidden');
            document.getElementById(`book-edit-${id}`).classList.remove('flex');
            document.getElementById(`book-view-${id}`).classList.remove('hidden');
        }

        async function saveBook(id) {
            const title = document.getElementById(`edit-title-${id}`).value.trim();
            const author = document.getElementById(`edit-author-${id}`).value.trim();
            
            if (!title) {
                alert("書名不能為空！");
                return;
            }

            try {
                const response = await fetch(`/api/books/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, author })
                });

                if (response.ok) {
                    loadBooks(); // 重新載入列表
                } else {
                    alert("更新失敗！");
                }
            } catch (error) {
                console.error("Error updating book:", error);
                alert("連線錯誤，無法更新");
            }
        }

        async function deleteBook(id) {
            if (!confirm("確定要刪除這本書嗎？")) {
                return;
            }

            try {
                const response = await fetch(`/api/books/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    loadBooks(); // 重新載入列表
                } else {
                    alert("刪除失敗！");
                }
            } catch (error) {
                console.error("Error deleting book:", error);
                alert("連線錯誤，無法刪除");
            }
        }

        function toggleBookList() {
            const container = document.getElementById('book-list-container');
            if (container.classList.contains('hidden')) {
                container.classList.remove('hidden');
                loadBooks();
            } else {
                container.classList.add('hidden');
            }
        }

        // Open Library API Fallback
        async function fetchOpenLibrary(isbn) {
            const apiUrl = `https://openlibrary.org/api/books?bibkeys=ISBN:${isbn}&format=json&jscmd=data`;
            try {
                updateStatus(`Open Library 查詢中...`);
                const response = await fetch(apiUrl);
                const data = await response.json();
                
                const bookKey = `ISBN:${isbn}`;
                if (data && data[bookKey]) {
                    const bookData = data[bookKey];
                    const title = bookData.title || "未知書名";
                    let authors = "未知作者";
                    if (bookData.authors && bookData.authors.length > 0) {
                        authors = bookData.authors.map(a => a.name).join(', ');
                    }
                    
                    let thumbnailUrl = "";
                    if (bookData.cover && bookData.cover.medium) {
                        thumbnailUrl = bookData.cover.medium;
                    }

                    showResultCard(title, authors, thumbnailUrl);
                    saveBookToDatabase({ isbn, title, author: authors, coverUrl: thumbnailUrl });
                } else {
                    // Open Library 也查不到，呼叫本地爬蟲
                    await fetchLocalAPI(isbn);
                }
            } catch (error) {
                console.error("Open Library API 錯誤:", error);
                await fetchLocalAPI(isbn);
            }
        }

        // 1. 定義呼叫 Google Books API 的函式
        async function fetchBookInfo(isbn) {
            document.getElementById('result-card').classList.remove('hidden');
            document.getElementById('manual-entry-card').classList.add('hidden');
            
            const coverEl = document.getElementById('book-cover');
            coverEl.classList.add('hidden');
            document.getElementById('book-title').innerText = "";
            document.getElementById('book-authors').innerText = "";

            updateStatus(`Google Books 查詢中 (${isbn})...`);

            const apiUrl = `https://www.googleapis.com/books/v1/volumes?q=isbn:${isbn}`;

            try {
                const response = await fetch(apiUrl);
                const data = await response.json();

                if (data.totalItems === 0 || !data.items) {
                    // Google Books 找不到，呼叫 Fallback
                    await fetchOpenLibrary(isbn);
                    return;
                }

                const volumeInfo = data.items[0].volumeInfo;
                const title = volumeInfo.title || "未知書名";
                const authors = volumeInfo.authors ? volumeInfo.authors.join(', ') : "未知作者"; 
                
                let thumbnailUrl = "";
                if (volumeInfo.imageLinks && volumeInfo.imageLinks.thumbnail) {
                     thumbnailUrl = volumeInfo.imageLinks.thumbnail.replace("http:", "https:");
                }

                showResultCard(title, authors, thumbnailUrl);
                saveBookToDatabase({ isbn, title, author: authors, coverUrl: thumbnailUrl, publishYear: volumeInfo.publishedDate });

            } catch (error) {
                console.error("Google Books API 錯誤:", error);
                // 發生錯誤也嘗試 fallback
                await fetchOpenLibrary(isbn);
            }
        }

        // 2. 掃描成功時的處理邏輯
        function onScanSuccess(decodedText, decodedResult) {
            if (decodedText === lastScannedIsbn) {
                return; // 防呆
            }
            lastScannedIsbn = decodedText;
            
            // 播放音效
            playBeepSound();
            
            // 將掃描到的 ISBN 傳給 API 函式
            fetchBookInfo(decodedText);
        }

        // 3. 初始化掃描器
        const formatsToSupport = [
            Html5QrcodeSupportedFormats.EAN_13,
            Html5QrcodeSupportedFormats.EAN_8
        ];

        let html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", 
            { 
                fps: 10,
                qrbox: { width: 300, height: 100 },
                formatsToSupport: formatsToSupport,
                videoConstraints: {
                    facingMode: "environment",
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                }
            },
            false
        );

        // 啟動掃描器
        html5QrcodeScanner.render(onScanSuccess);
        
        // 微調 html5-qrcode 自動產生的元素樣式以符合 Tailwind
        // 由於 DOM 是非同步生成的，我們用 MutationObserver 監聽按鈕的產生
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    const readerElement = document.getElementById('reader');
                    if (readerElement) {
                        const buttons = readerElement.querySelectorAll('button');
                        buttons.forEach(btn => {
                            if (!btn.classList.contains('tailwind-styled')) {
                                btn.className = "tailwind-styled bg-white text-gray-800 font-semibold py-2 px-4 border border-gray-400 rounded shadow hover:bg-gray-100 transition m-1";
                            }
                        });
                        const links = readerElement.querySelectorAll('a');
                        links.forEach(link => {
                            if (!link.classList.contains('tailwind-styled')) {
                                link.className = "tailwind-styled text-blue-600 hover:underline mx-2 text-sm";
                            }
                        });
                    }
                }
            });
        });
        
        observer.observe(document.getElementById('reader'), { childList: true, subtree: true });

    </script>
</body>
</html>
