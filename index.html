<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圖書掃描建檔系統</title>
    <!-- 引入 html5-qrcode 函式庫 -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-color: #f0f2f5;
        }
        #reader {
            width: 100%;
            max-width: 500px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .result-card {
            margin-top: 20px;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 460px;
            text-align: center;
            display: none; /* 預設隱藏，掃描成功才顯示 */
        }
        .status {
            font-size: 18px;
            font-weight: bold;
            color: #007bff;
            margin-bottom: 10px;
        }
        #book-cover {
            max-width: 150px;
            margin-top: 15px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
            display: none;
        }
        .error { color: #d32f2f; }
    </style>
</head>
<body>

    <h2>📚 圖書掃描建檔</h2>
    
    <!-- 掃描器畫面 -->
    <div id="reader"></div>
    
    <!-- 掃描與查詢結果 -->
    <div class="result-card" id="result-card">
        <div id="status-text" class="status">讀取中...</div>
        <h3 id="book-title"></h3>
        <p id="book-authors"></p>
        <img id="book-cover" src="" alt="書本封面">
    </div>

    <script>
        // 用來記錄上一次掃描的 ISBN，避免相機在半秒內重複觸發數十次 API 請求
        let lastScannedIsbn = "";

        // 1. 定義呼叫 Google Books API 的函式
        async function fetchBookInfo(isbn) {
            const statusText = document.getElementById('status-text');
            const titleEl = document.getElementById('book-title');
            const authorsEl = document.getElementById('book-authors');
            const coverEl = document.getElementById('book-cover');

            // 顯示查詢中狀態，清空舊資料
            statusText.innerText = `條碼 ${isbn} 查詢中...`;
            statusText.className = "status";
            titleEl.innerText = "";
            authorsEl.innerText = "";
            coverEl.style.display = "none";

            const apiUrl = `https://www.googleapis.com/books/v1/volumes?q=isbn:${isbn}`;

            try {
                const response = await fetch(apiUrl);
                const data = await response.json();

                if (data.totalItems === 0 || !data.items) {
                    statusText.innerText = `找不到 ISBN: ${isbn} 的書籍資料`;
                    statusText.className = "status error";
                    return;
                }

                const volumeInfo = data.items[0].volumeInfo;
                const title = volumeInfo.title || "未知書名";
                const authors = volumeInfo.authors ? volumeInfo.authors.join(', ') : "未知作者"; 
                
                let thumbnailUrl = "";
                if (volumeInfo.imageLinks && volumeInfo.imageLinks.thumbnail) {
                     thumbnailUrl = volumeInfo.imageLinks.thumbnail.replace("http:", "https:");
                }

                // 更新畫面
                statusText.innerText = "✅ 查詢成功！";
                statusText.style.color = "#2e7d32";
                titleEl.innerText = title;
                authorsEl.innerText = `作者：${authors}`;
                
                if (thumbnailUrl) {
                    coverEl.src = thumbnailUrl;
                    coverEl.style.display = 'inline-block';
                }

            } catch (error) {
                console.error("API 錯誤:", error);
                statusText.innerText = "查詢失敗，請檢查網路連線。";
                statusText.className = "status error";
            }
        }

        // 2. 掃描成功時的處理邏輯
        function onScanSuccess(decodedText, decodedResult) {
            // 防呆：如果跟上一次掃描的條碼一樣，就直接跳過，不重複發 API
            if (decodedText === lastScannedIsbn) {
                return;
            }
            
            lastScannedIsbn = decodedText;
            
            // 顯示結果區塊
            document.getElementById('result-card').style.display = 'block';
            
            // 將掃描到的 ISBN 傳給 API 函式
            fetchBookInfo(decodedText);
        }

        // 3. 初始化掃描器 (加入優化參數)
        const formatsToSupport = [
            Html5QrcodeSupportedFormats.EAN_13,
            Html5QrcodeSupportedFormats.EAN_8
        ];

        let html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", 
            { 
                fps: 10,
                qrbox: { width: 300, height: 100 },
                formatsToSupport: formatsToSupport,
                videoConstraints: {
                    facingMode: "environment",
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                }
            },
            false
        );

        // 啟動掃描器
        html5QrcodeScanner.render(onScanSuccess);
    </script>

</body>
</html>
